skill: humanizer-zh
should_trigger:
  - 帮我改掉这段文字的 AI 味
should_not_trigger:
  - 判断这篇文章是不是 AI 写的
execute:
  task: |
    下面是一段充满 AI 腔的中文短文。请按 skill 的方法编辑它：删掉空话、重复和模板化表达，保留事实和作者声音，把编辑后的完整结果写入沙箱中的 output.md。

    原文：
    在当今快速发展的时代，AI 技术已经深深地渗透到了我们生活的方方面面。作为一款革命性的产品，我们的全新智能助手不仅能够帮助你提高工作效率，还能够为你的生活带来前所未有的便利。值得一提的是，这款助手采用了先进的算法，旨在为用户提供更加优质的体验。产品将于 2026 年 10 月 15 日上线，定价每月 29 元。总而言之，它将成为你不可或缺的得力助手。
  artifacts:
    - output.md
  rubric:
    - output.md 存在且非空
    - 保留了原文的核心事实（2026 年 10 月 15 日上线、每月 29 元）
    - 删掉了模板化空话（如"在当今快速发展的时代""值得一提的是""总而言之"）
    - 文风自然，没有引入新的 AI 腔
