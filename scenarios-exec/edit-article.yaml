skill: edit-article
should_trigger:
  - 帮我改这篇稿子的表达
should_not_trigger:
  - 帮我从头写一篇新稿子
execute:
  task: |
    下面是一篇短文初稿。请按 skill 的方法编辑它：修正错别字与语病、统一术语、删掉口水句，把编辑后的完整稿子写入沙箱中的 edited.md，并在文末用三行以内说明主要改动。

    初稿：
    这个工具是我花俩天做出来的。它的主要功能是帮助用户管理自己滴 skill 库，之所以做这个，是因为市面上的工具都只管安装，不管质量。做的时候遇到很多坑，比如 Windows 环境的路径问题，还有测试环境的差异问题等等不一而足。总的来说这个项目让我学到很多。
  artifacts:
    - edited.md
  rubric:
    - edited.md 存在且非空
    - 错别字已修正（俩天→两天、滴→的）
    - 总的来说/学到很多这类口水收尾被处理
    - 文末有不超过三行的改动说明
